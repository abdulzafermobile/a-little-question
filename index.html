<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A Little Question 💌</title>
  <meta name="description" content="A very important question, just for you." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Floating background hearts (generated by JS) -->
  <div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>

  <!-- Confetti layer -->
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- ============ SCREEN 1: THE QUESTION ============ -->
  <main class="screen screen--ask" id="askScreen">
    <div class="card card--ask">
      <div class="mascot" aria-hidden="true">
        <span class="mascot__heart">💗</span>
        <span class="mascot__spark mascot__spark--1">✨</span>
        <span class="mascot__spark mascot__spark--2">✨</span>
      </div>

      <p class="eyebrow" id="greeting">Hey you 💕</p>

      <h1 class="question">
        Will you go on a
        <span class="highlight">romantic date night</span>
        with me tonight?
      </h1>

      <p class="hint" id="hint" aria-live="polite">Choose wisely… 😇</p>

      <div class="actions" id="actions">
        <button class="btn btn--yes" id="yesBtn" type="button">YES! 💖</button>
        <button class="btn btn--no" id="noBtn" type="button">No</button>
      </div>
    </div>
  </main>

  <!-- ============ SCREEN 2: SUCCESS ============ -->
  <section class="screen screen--success" id="successScreen" hidden>
    <article class="card card--success">
      <div class="photo">
        <img id="photoImg" alt="Our romantic dinner spot" hidden />
        <div class="photo__placeholder" id="photoPlaceholder">
          <svg viewBox="0 0 240 150" role="img" aria-label="Candlelit dinner illustration">
            <circle cx="198" cy="32" r="16" fill="#fff7dc" />
            <circle cx="205" cy="27" r="14" fill="#f3dcff" opacity=".9" />
            <text x="30" y="40" font-size="14">✨</text>
            <text x="150" y="58" font-size="10">✨</text>
            <!-- table -->
            <rect x="18" y="104" width="204" height="10" rx="5" fill="#b39dfa" />
            <rect x="40" y="114" width="8" height="32" rx="3" fill="#a48af5" />
            <rect x="192" y="114" width="8" height="32" rx="3" fill="#a48af5" />
            <!-- plates -->
            <ellipse cx="62" cy="101" rx="22" ry="4" fill="#fff" />
            <ellipse cx="178" cy="101" rx="22" ry="4" fill="#fff" />
            <!-- candle -->
            <rect x="114" y="72" width="12" height="30" rx="3" fill="#fff" />
            <ellipse class="flame" cx="120" cy="63" rx="5" ry="9" fill="#ffb86b" />
            <ellipse cx="120" cy="66" rx="2.4" ry="4.5" fill="#fff3c4" />
            <!-- glasses -->
            <path d="M82 58 h18 q0 20 -9 22 q-9 -2 -9 -22z" fill="#ff8fab" opacity=".85" />
            <rect x="90" y="80" width="2" height="16" fill="#fff" />
            <rect x="84" y="96" width="14" height="3" rx="1.5" fill="#fff" />
            <path d="M140 58 h18 q0 20 -9 22 q-9 -2 -9 -22z" fill="#ff8fab" opacity=".85" />
            <rect x="148" y="80" width="2" height="16" fill="#fff" />
            <rect x="142" y="96" width="14" height="3" rx="1.5" fill="#fff" />
            <text x="111" y="44" font-size="16">💞</text>
          </svg>
          <span>Your dinner spot photo goes here</span>
        </div>
        <span class="photo__badge">It's a date! 💘</span>
      </div>

      <div class="success__body">
        <h2 class="success__title">Yaaay! I knew you'd say yes! 🥰</h2>
        <p class="success__message" id="message"></p>

        <ul class="details">
          <li class="details__item details__item--pink">
            <span class="details__icon">📅</span>
            <div><small>When</small><strong id="dDate"></strong></div>
          </li>
          <li class="details__item details__item--lav">
            <span class="details__icon">🕗</span>
            <div><small>Time</small><strong id="dTime"></strong></div>
          </li>
          <li class="details__item details__item--mint">
            <span class="details__icon">📍</span>
            <div><small>Where</small><strong id="dPlace"></strong><em id="dAddress"></em></div>
          </li>
          <li class="details__item details__item--peach">
            <span class="details__icon">👗</span>
            <div><small>Dress code</small><strong id="dDress"></strong></div>
          </li>
        </ul>

        <p class="tries" id="tries"></p>

        <div class="success__actions">
          <button class="btn btn--primary" id="calendarBtn" type="button">Add to calendar 📅</button>
          <button class="btn btn--ghost" id="againBtn" type="button">More confetti 🎉</button>
        </div>
      </div>
    </article>
  </section>

  <script src="script.js"></script>
</body>
</html>
